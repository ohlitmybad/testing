<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link rel="stylesheet" href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <script type="text/javascript">document.body.style.visibility="hidden";</script><div id="SFctr" data-org="31002" data-mfl="64c215764c0b6076026762a3"><div style="clear:both"></div></div><script type="text/javascript" src="https://cdn.membershipworks.com/mfl.js"></script>
    <div class="container">
        <div class="chart-wrapper">
            <div class="toolbar">
            <div class="toolbar-rows">
            <div class="selectors-container">
                <div class="custom-select-container metric-selector">
                    <div class="custom-select-trigger" id="metric-select-trigger">
                        <span data-i18n="metrics.minutesPlayed">Minutes played</span>
                    </div>
                    <div class="custom-select-options multi-select" id="metric-select-options" style="display: none;">
                        <div class="dropdown-search-wrap">
                            <input type="search" id="metricSearch" placeholder="Search metrics" data-i18n="search.metrics" autocomplete="off" spellcheck="false">
                        </div>
                        <div id="metric-select-list"></div>
                    </div>
                </div>
                <select id="metric" style="display: none;"></select>
                <input type="checkbox" id="toggleSort" style="display: none;">

                <div class="custom-select-container position-selector">
                    <div class="custom-select-trigger" id="position-select-trigger">
                        <span data-i18n="positions.goalkeeper">Goalkeeper</span>
                    </div>
                    <div class="custom-select-options multi-select" id="position-select-options" style="display: none;"></div>
                </div>
                <select id="position" style="display: none;">
                    <option value="Goalkeeper" data-i18n="positions.goalkeeper">Goalkeeper</option>
                    <option value="Centre-back" data-i18n="positions.centreback">Centre-back</option>
                    <option value="Full-back" data-i18n="positions.fullback">Full-back</option>
                    <option value="Midfielder" data-i18n="positions.midfielder">Midfielder</option>
                    <option value="Winger" data-i18n="positions.winger">Winger</option>
                    <option value="Striker" data-i18n="positions.striker">Striker</option>
                    <option value="All" data-i18n="positions.all">All positions</option>
                </select>
                <select id="league" multiple style="display: none;"></select>

                <div class="custom-select-container league-selector">
                  <div class="custom-select-trigger has-icon" id="league-select-trigger">
                    <iconify-icon icon="emojione:flag-for-united-kingdom" width="18" height="18"></iconify-icon>
                    <span data-i18n="leagues.premierLeague">Premier League</span>
                  </div>
                  <div class="custom-select-options multi-select" id="league-select-options" style="display: none;"></div>
                </div>

                <div class="custom-select-container age-selector">
                    <div class="custom-select-trigger" id="age-select-trigger">
                        <span data-i18n="age.all">Age</span>
                    </div>
                    <div class="custom-select-options" id="age-select-options" style="display: none;">
                        <div class="custom-select-option selected" data-value="">
                            <span data-i18n="age.all">Age</span>
                        </div>
                        <div class="custom-select-option" data-value="17"><span>U17</span></div>
                        <div class="custom-select-option" data-value="18"><span>U18</span></div>
                        <div class="custom-select-option" data-value="19"><span>U19</span></div>
                        <div class="custom-select-option" data-value="20"><span>U20</span></div>
                        <div class="custom-select-option" data-value="21"><span>U21</span></div>
                        <div class="custom-select-option" data-value="22"><span>U22</span></div>
                        <div class="custom-select-option" data-value="23"><span>U23</span></div>
                        <div class="custom-select-option" data-value="24"><span>U24</span></div>
                        <div class="custom-select-option" data-value="25"><span>U25</span></div>
                        <div class="custom-select-option" data-value="26"><span>U26</span></div>
                        <div class="custom-select-option" data-value="27"><span>U27</span></div>
                        <div class="custom-select-option" data-value="28"><span>U28</span></div>
                        <div class="custom-select-option" data-value="29"><span>U29</span></div>
                        <div class="custom-select-option" data-value="30"><span>U30</span></div>
                        <div class="custom-select-option" data-value="35"><span>U35</span></div>
                    </div>
                </div>
                <select id="age" style="display: none;">
                    <option value="" data-i18n="age.all">Age</option>
                    <option value="17">U17</option>
                    <option value="18">U18</option>
                    <option value="19">U19</option>
                    <option value="20">U20</option>
                    <option value="21">U21</option>
                    <option value="22">U22</option>
                    <option value="23">U23</option>
                    <option value="24">U24</option>
                    <option value="25">U25</option>
                    <option value="26">U26</option>
                    <option value="27">U27</option>
                    <option value="28">U28</option>
                    <option value="29">U29</option>
                    <option value="30">U30</option>
                    <option value="35">U35</option>
                </select>
                <div class="metrics-toggle-button">
                    <button type="button" id="toggleMetrics">
                        <i class="ion-ios-stopwatch-outline"></i>
                    </button>
                    <span class="btn-tooltip-text" data-i18n="toggles.switchToTotal">Switch to total</span>
                </div>
                <div class="past-season-button">
                    <button type="button" id="pastSeasonBtn">
                        <i class="ion-calendar"></i>
                    </button>
                    <span class="btn-tooltip-text" data-i18n="toggles.switchToPastSeason">Switch to past season</span>
                </div>
            </div>

            <div class="filters-container">
                <input type="search" id="playerSearch" placeholder="Search player or team" data-i18n="search.placeholder" autocomplete="off" spellcheck="false">
                <div class="threshold-min-field is-empty" id="thresholdMinField">
                    <span class="threshold-label" data-i18n="filters.min">Min</span>
                    <span class="threshold-gt" aria-hidden="true">&gt;</span>
                    <input type="number" id="thresholdMin" min="0" step="any" inputmode="decimal" placeholder="">
                </div>
                <div class="custom-select-container threshold-metric-selector">
                    <div class="custom-select-trigger" id="threshold-metric-trigger">
                        <span data-i18n="metrics.minutesPlayed">Minutes played</span>
                    </div>
                    <div class="custom-select-options" id="threshold-metric-options" style="display: none;">
                        <div class="dropdown-search-wrap">
                            <input type="search" id="thresholdMetricSearch" placeholder="Search metrics" data-i18n="search.metrics" autocomplete="off" spellcheck="false">
                            <div class="threshold-mode" id="thresholdMode">
                                <button type="button" id="thresholdPer90" class="active" data-i18n="filters.per90">per 90</button>
                                <button type="button" id="thresholdTotal" data-i18n="filters.total">total</button>
                            </div>
                        </div>
                        <div id="threshold-metric-list"></div>
                    </div>
                </div>
            </div>
            </div>
            </div>
            <div class="metric-legend" id="metricLegend" hidden></div>

            <div class="result-container">
                <div id="tableLoading" class="table-loading" hidden></div>
                <div id="playerTable" class="player-list" style="display: none;"></div>
            </div>
        </div>
    </div>

    <div class="dark-mode-toggle" onclick="toggleDarkMode()">
        <span class="toggle-icon"></span>
    </div>

    <script src="index.js"></script>
    <script src="indexhelpers.js"></script>
</body>
</html>
